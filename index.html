<!doctype html>

    <meta charset="UTF-8" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages (MIT, https://github.com/rafgraph/spa-github-pages).
      // Pairs with public/404.html: restores the deep-linked path that 404.html
      // encoded into a query string, before React Router mounts.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
