<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vespa UI</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages (MIT, https://github.com/rafgraph/spa-github-pages)
      //
      // GitHub Pages has no server-side routing, so any deep link (e.g.
      // /vespa-ui/docs/getting-started/installation) that isn't a physical
      // file gets served this 404.html. It re-encodes the intended path into
      // a query string and redirects to the site root, where the inline
      // script in index.html restores it via history.replaceState before
      // React Router mounts.
      //
      // pathSegmentsToKeep = number of path segments that form the site's
      // base path. Must match vite.config.ts's build "base":
      //   - GitHub Pages project site "/vespa-ui/" (default)  -> 1
      //   - Custom domain or user/org page served at "/"      -> 0
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
