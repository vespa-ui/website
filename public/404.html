<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vespa UI</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages (MIT, https://github.com/rafgraph/spa-github-pages)
      //
      // Generated by scripts/generate-seo.mjs — pathSegmentsToKeep must match
      // vite.config.ts build "base" (0 for "/" org/custom domain, 1 for "/repo/").
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
