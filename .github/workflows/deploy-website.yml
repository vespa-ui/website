name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build
        # base_path is "" for an org/user page (repo named <org>.github.io) and
        # "/<repo>" for project pages. Must match Vite's base and 404.html.
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path == '' && '/' || format('{0}/', steps.pages.outputs.base_path) }}
          SITE_BASE: ${{ steps.pages.outputs.base_path == '' && '/' || format('{0}/', steps.pages.outputs.base_path) }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
